<title>Painel Central de Vendas · Acesso</title>
<style>
  :root { --navy:#1c2156; --navy-2:#2b3170; --roxo:#4b2758; --vermelho:#e11d27; --rosa:#ff9db0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { font-family: Inter, "Segoe UI", system-ui, Arial, sans-serif; color: #151a3d; min-height: 100vh;
    background: linear-gradient(120deg, var(--navy) 0%, var(--navy) 50%, var(--navy-2) 75%, var(--roxo) 100%);
    display: grid; place-items: center; padding: 24px 16px; }
  .caixa { background: #fff; width: 100%; max-width: 420px; border-radius: 18px; padding: 32px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .marca { font-weight: 800; color: var(--vermelho); font-size: 20px; letter-spacing: -.3px; }
  .sobre { font-family: Consolas, monospace; color: var(--vermelho); font-size: 11px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; margin-top: 18px; }
  h1 { margin: 6px 0 4px; font-size: 24px; color: var(--navy); line-height: 1.2; }
  h1 span { color: #c2446a; }
  p.sub { margin: 0 0 22px; color: #565c78; font-size: 14px; }
  label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: #565c78; }
  input { display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 16px; padding: 12px 14px;
    border: 1.5px solid #e4e6ef; border-radius: 10px; background: #fafbfd; }
  input:focus { outline: none; border-color: var(--navy-2); background: #fff; box-shadow: 0 0 0 3px rgba(43,49,112,.12); }
  button { margin-top: 16px; width: 100%; font: inherit; font-size: 16px; font-weight: 700; padding: 13px; border: 0;
    border-radius: 10px; background: var(--vermelho); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .lembrar { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 14px; color: #565c78; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .lembrar input { width: auto; margin: 0; }
  .msg { margin-top: 16px; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.4; display: none; }
  .msg.erro { display: block; background: #fde4e5; color: #b1161f; }
  .msg.info { display: block; background: #eef1fb; color: var(--navy); }
  .rodape { margin-top: 22px; font-size: 12px; color: #8a8fa6; text-align: center; }
</style>

PMbCKzSHobBejwcN9CqhKmg2Zh20Q+JJ/WBS3qs"}, {"iv": "4OEcZSwPRJWt1HO/", "k": "tLIIrrZ6N+nEs91x8APhPbtuduVycz8qer/93DyONCvrwb78zViUCso2LZ3TPCAs"}]};
const CHAVE_LOCAL = "painel_vendas_email";
const de64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const guardar = (k, v) => { try { v === null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const lerGuardado = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };

async function abrir(email) {
  const e = String(email || "").trim().toLowerCase();
  if (!e) return false;
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(e), "PBKDF2", false, ["deriveKey"]);
  const chaveEmail = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: de64(PACOTE.sal), iterations: PACOTE.it, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  for (const a of PACOTE.a) {
    try {
      const bruta = await crypto.subtle.decrypt({ name: "AES-GCM", iv: de64(a.iv) }, chaveEmail, de64(a.k));
      const chavePainel = await crypto.subtle.importKey("raw", bruta, "AES-GCM", false, ["decrypt"]);
      const html = await crypto.subtle.decrypt({ name: "AES-GCM", iv: de64(PACOTE.iv) }, chavePainel, de64(PACOTE.c));
      document.open(); document.write(new TextDecoder().decode(html)); document.close();
      return true;
    } catch (err) { /* este acesso não é deste e-mail: tenta o próximo */ }
  }
  return false;
}

const form = document.getElementById("form"), msg = document.getElementById("msg"), botao = document.getElementById("entrar");
const mostrar = (tipo, texto) => { msg.className = "msg " + tipo; msg.textContent = texto; };

if (!window.crypto || !crypto.subtle) {
  mostrar("erro", "Este navegador não é compatível. Use o Chrome, Edge, Safari ou Firefox atualizado.");
  botao.disabled = true;
}

form.addEventListener("submit", async ev => {
  ev.preventDefault();
  const email = document.getElementById("email").value;
  botao.disabled = true; botao.textContent = "Verificando..."; mostrar("info", "Verificando seu acesso...");
  const ok = await abrir(email).catch(() => false);
  if (ok) {
    guardar(CHAVE_LOCAL, document.getElementById("lembrar")?.checked !== false ? email.trim().toLowerCase() : null);
    return;
  }
  botao.disabled = false; botao.textContent = "Entrar";
  mostrar("erro", "Acesso negado: este e-mail não está cadastrado. Fale com a coordenação da Central de Vendas para solicitar o acesso.");
});

// entrada automática se o e-mail já foi lembrado neste dispositivo
(async () => {
  const salvo = lerGuardado(CHAVE_LOCAL);
  if (!salvo || botao.disabled) return;
  document.getElementById("email").value = salvo;
  mostrar("info", "Entrando...");
  const ok = await abrir(salvo).catch(() => false);
  if (!ok) { guardar(CHAVE_LOCAL, null); mostrar("erro", "Seu acesso não está mais ativo. Fale com a coordenação da Central de Vendas para solicitar o acesso."); }
})();
</script>
